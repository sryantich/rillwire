[workspace]
members = ["crates/rillwire-core", "crates/rillwire-protocol", "apps/desktop", "apps/lab"]
default-members = ["crates/rillwire-core", "crates/rillwire-protocol", "apps/lab"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
authors = ["Rillwire contributors"]

[workspace.dependencies]
rillwire-core = { path = "crates/rillwire-core" }
rillwire-protocol = { path = "crates/rillwire-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
