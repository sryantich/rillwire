name: Rust CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo test -p rillwire-core -p rillwire-protocol -p rillwire-lab --locked
      - run: cargo run -p rillwire-lab --locked -- replay
  windows-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build -p rillwire-desktop --release --locked --target x86_64-pc-windows-msvc
      - name: Package unsigned research preview
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/rillwire-desktop.exe dist/
          Copy-Item README.md,LICENSE dist/
          (Get-FileHash dist/rillwire-desktop.exe -Algorithm SHA256).Hash | Set-Content dist/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rillwire-windows-x64-unsigned-preview
          path: dist/
          retention-days: 14
          if-no-files-found: error
